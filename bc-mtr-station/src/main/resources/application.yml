server:
  port: 8081

spring:
  datasource: 
    # 1. Update to the PostgreSQL driver
    driver-class-name: org.postgresql.Driver
    # 2. Update protocol to postgresql and default port to 5432
    url: "jdbc:postgresql://postgres-container:5432/bootcamp_2512"
    username: "postgres" # Default PostgreSQL user is often 'postgres'
    password: "admin1234"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      # 3. Update to the PostgreSQL dialect
      # Note: Hibernate 6+ often auto-detects this; you can usually remove this line entirely
      dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

  data:
    redis:
      host: redis-container
      port: 6379




external-api:
  hk-mtr: 
    domain: "rt.data.gov.hk"
    schedule:
      path-segment: "v1/transport/mtr"
      path: "/getSchedule.php"